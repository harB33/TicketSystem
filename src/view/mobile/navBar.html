<style>
    .menu-container {
        scale: 1;
        position: absolute;
        right: 0;
        bottom: 20%;
        width: 140px;
        height: 280px;
    }

    /* The full fan shape — white bg, clipped to half-circle */
    .outer-layer {
        position: absolute;
        width: 100%;
        height: 100%;
        clip-path: ellipse(100% 50% at 100% 50%);
        transition: transform 0.2s cubic-bezier(0.73, 0.07, 0.31, 1.04),
            opacity 0.25s ease;
        transform: scale(0);
        opacity: 0;
        transform-origin: right center;
        background: white;
    }

    /* SVG draws the border + divider lines + inner circle ring */
    .pie-svg {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        pointer-events: none;
        overflow: visible;
    }

    /* Icon links — each covers its full wedge slice */
    .outer-layer a {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        color: #ff6699;
        text-decoration: none;
        z-index: 5;
    }

    .outer-layer a:hover svg,
    .outer-layer a:focus svg,
    .outer-layer a.icon-hovered .link-icon {
        transform: scale(1.25);
        stroke: white;
    }

    /* Hover slice highlight */
    .slice-highlight {
        fill: transparent;
        transition: fill 0.2s ease;
        pointer-events: none;
    }

    .slice-highlight.hovered {
        fill: #ff6699;
    }

    /*
  Wedge clip-paths — each link is clipped to its pie slice so only
  that region is interactive. Paths match the SVG highlight geometry.
*/
    .link1 {
        clip-path: path('M 140 88 L 140 0 A 140 140 0 0 0 19 70 L 95 114 A 52 52 0 0 1 140 88 Z');
    }

    .link2 {
        clip-path: path('M 95 114 L 19 70 A 140 140 0 0 0 19 210 L 95 166 A 52 52 0 0 1 95 114 Z');
    }

    .link3 {
        clip-path: path('M 95 166 L 19 210 A 140 140 0 0 0 140 280 L 140 192 A 52 52 0 0 1 95 166 Z');
    }

    /* Icons absolutely positioned at wedge centroid inside the full-size link */
    .link-icon {
        position: absolute;
        width: 26px;
        height: 26px;
        transition: transform 0.2s ease;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.6;
    }

    .link1 .link-icon {
        left: 79px;
        top: 44px;
    }

    .link2 .link-icon {
        left: 31px;
        top: 127px;
    }

    .link3 .link-icon {
        left: 79px;
        top: 210px;
    }

    .outer-layer svg.pie-svg path,
    .outer-layer svg.pie-svg line,
    .outer-layer svg.pie-svg circle {
        stroke: #222;
        stroke-width: 1.5;
        /* consistent border thickness across all pie elements */
    }

    /* The clickable toggle button — sized to match SVG inner circle (r=52, cx=140, cy=140)
   Visible half-disc: width=52px (radius), height=104px (diameter), top=88px (cy - r) */
    .inner-button {
        position: absolute;
        right: 0;
        top: 88px;
        width: 52px;
        height: 104px;
        background-color: #ff6699;
        border: none;
        z-index: 10;
        clip-path: ellipse(100% 50% at 100% 50%);
        cursor: pointer;
        transition: background 0.2s ease, opacity 0.25s ease;
        opacity: 1;
    }

    .inner-button:hover {
        background-color: #e0557f;
    }

    .menu-container.active .inner-button {
        opacity: 0;
        pointer-events: none;
    }

    .menu-container.active .outer-layer {
        transform: scale(1);
        opacity: 1;
    }

    .inner-button svg {
        transform: translateX(5px);
    }

    /* Selection Arrow Indicator */
    .selection-arrow {
        position: absolute;
        left: var(--arrow-left, -40px);
        width: 32px;
        height: 32px;
        pointer-events: none;
        z-index: 20;
        opacity: 0;
        top: var(--arrow-top, 140px);
        transform: translate(-50%, -50%) rotate(var(--arrow-rotate, 0deg)) scale(0);
        transition:
            top 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275),
            left 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275),
            transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275),
            opacity 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .selection-arrow.visible {
        opacity: 1;
        transform: translate(-50%, -50%) rotate(var(--arrow-rotate, 0deg)) scale(1);
    }

    .selection-arrow.dragging {
        transition: none !important;
    }
</style>

<div class="menu-container">

    <div class="outer-layer">

              150° → outer (18.76, 70)   inner (94.97, 114)
              210° → outer (18.76, 210)  inner (94.97, 166)

            Icon midpoints at mid-radius=96:
              120° → (92, 57)    left:79 top:44
              180° → (44, 140)   left:31 top:127
              240° → (92, 223)   left:79 top:210
        -->
        <svg class="pie-svg" viewBox="0 0 140 280" xmlns="http://www.w3.org/2000/svg">
            <!-- Outer half-circle fill + border -->
            <path d="M 140 0 A 140 140 0 0 0 140 280 Z" fill="white" />

            <!-- Donut-wedge hover highlight paths -->
            <!-- Top slice -->
            <path id="slice1" class="slice-highlight"
                d="M 140 88 L 140 0 A 140 140 0 0 0 19 70 L 95 114 A 52 52 0 0 1 140 88 Z" />
            <!-- Middle slice -->
            <path id="slice2" class="slice-highlight"
                d="M 95 114 L 19 70 A 140 140 0 0 0 19 210 L 95 166 A 52 52 0 0 1 95 114 Z" />
            <!-- Bottom slice -->
            <path id="slice3" class="slice-highlight"
                d="M 95 166 L 19 210 A 140 140 0 0 0 140 280 L 140 192 A 52 52 0 0 1 95 166 Z" />

            <!-- Divider line 1 at 150° -->
            <line x1="95" y1="114" x2="19" y2="70" />

            <!-- Divider line 2 at 210° -->
            <line x1="95" y1="166" x2="19" y2="210" />

            <!-- Outer arc border (on top of highlights) -->
            <path d="M 140 0 A 140 140 0 0 0 140 280 Z" fill="none" />

            <!-- Inner circle ring -->
            <circle cx="140" cy="140" r="52" fill="white" />
        </svg>

        <!-- Profile icon -->
        <a href="?page=profile" class="link1">
            <svg class="link-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linecap="round"
                stroke-linejoin="round">
                <path
                    d="M17 8.5C17 5.73858 14.7614 3.5 12 3.5C9.23858 3.5 7 5.73858 7 8.5C7 11.2614 9.23858 13.5 12 13.5C14.7614 13.5 17 11.2614 17 8.5Z" />
                <path d="M19 20.5C19 16.634 15.866 13.5 12 13.5C8.13401 13.5 5 16.634 5 20.5" />

        <!-- Home icon -->
        <a href="?page=featured" class="link2">
            <svg class="link-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linecap="round"
                stroke-linejoin="round">
                <path
                    d="M3 11.9896V14.5C3 17.7998 3 19.4497 4.02513 20.4749C5.05025 21.5 6.70017 21.5 10 21.5H14C17.2998 21.5 18.9497 21.5 19.9749 20.4749C21 19.4497 21 17.7998 21 14.5V11.9896C21 10.3083 21 9.46773 20.6441 8.74005C20.2882 8.01237 19.6247 7.49628 18.2976 6.46411L16.2976 4.90855C14.2331 3.30285 13.2009 2.5 12 2.5C10.7991 2.5 9.76689 3.30285 7.70242 4.90855L5.70241 6.46411C4.37533 7.49628 3.71179 8.01237 3.3559 8.74005C3 9.46773 3 10.3083 3 11.9896Z" />
                <path
                    d="M15 21.5V16.5C15 15.0858 15 14.3787 14.5607 13.9393C14.1213 13.5 13.4142 13.5 12 13.5C10.5858 13.5 9.87868 13.5 9.43934 13.9393C9 14.3787 9 15.0858 9 16.5V21.5" />
            </svg>

        <!-- Ticket icon -->
        <a href="?page=mytickets" class="link3">
            <svg class="link-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linejoin="round">
                <path
                    d="M2.46433 9.34375C2.21579 9.34375 1.98899 9.14229 2.00041 8.87895C2.06733 7.33687 2.25481 6.33298 2.78008 5.53884C3.08228 5.08196 3.45765 4.68459 3.88923 4.36468C5.05575 3.5 6.70139 3.5 9.99266 3.5H14.0074C17.2986 3.5 18.9443 3.5 20.1108 4.36468C20.5424 4.68459 20.9177 5.08196 21.2199 5.53884C21.7452 6.33289 21.9327 7.33665 21.9996 8.87843C22.011 9.14208 21.7839 9.34375 21.5351 9.34375C20.1493 9.34375 19.0259 10.533 19.0259 12C19.0259 13.467 20.1493 14.6562 21.5351 14.6562C21.7839 14.6562 22.011 14.8579 21.9996 15.1216C21.9327 16.6634 21.7452 17.6671 21.2199 18.4612C20.9177 18.918 20.5424 19.3154 20.1108 19.6353C18.9443 20.5 17.2986 20.5 14.0074 20.5H9.99266C6.70139 20.5 5.05575 20.5 3.88923 19.6353C3.45765 19.3154 3.08228 18.918 2.78008 18.4612C2.25481 17.667 2.06733 16.6631 2.00041 15.1211C1.98899 14.8577 2.21579 14.6562 2.46433 14.6562C3.85012 14.6562 4.97352 13.467 4.97352 12C4.97352 10.533 3.85012 9.34375 2.46433 9.34375Z" />

</div>

<script>
    const btn = document.querySelector('.inner-button');
    const container = document.querySelector('.menu-container');

    let holdTimer = null;
    const HOLD_DELAY = 10; // ms before menu opens

    // Slice map — used by both mouse hover and touch drag
    const linkSliceMap = [
        { link: document.querySelector('.link1'), slice: document.getElementById('slice1') },
        { link: document.querySelector('.link2'), slice: document.getElementById('slice2') },
        { link: document.querySelector('.link3'), slice: document.getElementById('slice3') },
    ];

    let activeSlice = null;
    let activeLink = null;
    const arrow = document.querySelector('.selection-arrow');

    // Radial alignment: Updated for 151px distance (140 radius + 5 gap + 6 offset)
    const arrowConfig = {
        'slice1': { top: 9.2, left: 64.5, rotate: 60 },
        'slice2': { top: 140, left: -11, rotate: 0 },
        'slice3': { top: 270.8, left: 64.5, rotate: -60 }
    };

    function updateArrow(clientX, clientY, isDragging = false) {
        const rect = container.getBoundingClientRect();
        const cx = rect.left + 140; // Fan center is at the right edge of 140px container
        const cy = rect.top + 140;

        const dx = clientX - cx;
        const dy = clientY - cy;

        let angleRad = Math.atan2(dy, dx);

        // Clamp to the left half-circle (90deg to 270deg)
        if (Math.abs(angleRad) < Math.PI / 2) {
            angleRad = angleRad > 0 ? Math.PI / 2 : -Math.PI / 2;
        }

        const dist = 156; // 140 (radius) + 5 (gap) + 6 (arrow offset from center)
        const x = 140 + dist * Math.cos(angleRad);
        const y = 140 + dist * Math.sin(angleRad);

        const angleDeg = angleRad * 180 / Math.PI;
        const rotation = angleDeg - 180;

        if (isDragging) {
            arrow.classList.add('dragging');
        } else {
            arrow.classList.remove('dragging');
        }

        arrow.style.setProperty('--arrow-top', `${y}px`);
        arrow.style.setProperty('--arrow-left', `${x}px`);
        arrow.style.setProperty('--arrow-rotate', `${rotation}deg`);
        arrow.classList.add('visible');
    }

    function highlightSlice(slice, isDragging = false) {
        if (slice === activeSlice) return;

        if (activeSlice) activeSlice.classList.remove('hovered');
        if (activeLink) activeLink.classList.remove('icon-hovered');

        if (slice) {
            slice.classList.add('hovered');

            // Update arrow position and rotation — only if not manually dragging
            if (!isDragging) {
                const config = arrowConfig[slice.id];
                if (config) {
                    arrow.style.setProperty('--arrow-top', `${config.top}px`);
                    arrow.style.setProperty('--arrow-left', `${config.left}px`);
                    arrow.style.setProperty('--arrow-rotate', `${config.rotate}deg`);
                    arrow.classList.add('visible');
                }
            }

            // Also scale the icon in the matching link
            const entry = linkSliceMap.find(m => m.slice === slice);
            if (entry) {
                entry.link.classList.add('icon-hovered');
                activeLink = entry.link;
            }
        } else if (!isDragging) {
            // Only hide arrow if not dragging
            arrow.classList.remove('visible');
        }
        activeSlice = slice;
    }

    function clearSlice() {
        if (activeSlice) activeSlice.classList.remove('hovered');
        if (activeLink) activeLink.classList.remove('icon-hovered');
        arrow.classList.remove('visible');
        arrow.classList.remove('dragging');
        activeSlice = null;
        activeLink = null;
    }

    // Given a point (clientX, clientY), find which slice should be highlighted
    function sliceFromPoint(x, y) {
        // Temporarily hide the SVG so elementFromPoint can hit the <a> beneath it
        const svg = container.querySelector('.pie-svg');
        svg.style.pointerEvents = 'none'; // already none, but be explicit
        const el = document.elementFromPoint(x, y);
        if (!el) return null;
        // Walk up DOM to find an <a> inside our container
        let node = el;
        while (node && node !== container) {
            if (node.tagName === 'A') {
                const found = linkSliceMap.find(m => m.link === node);
                return found ? found.slice : null;
            }
            node = node.parentElement;
        }
        return null;
    }

    function openMenu() {
        container.classList.add('active');
        holdTimer = null; // ← mark that the menu is now open
    }

    function closeMenu() {
        container.classList.remove('active');
        clearTimeout(holdTimer);
        holdTimer = null;
        clearSlice();
    }

    function startHold(e) {
        e.preventDefault();
        holdTimer = setTimeout(openMenu, HOLD_DELAY);
    }

    function endHold(e) {
        if (holdTimer) {
            // Released before delay opened the menu — cancel
            clearTimeout(holdTimer);
            holdTimer = null;
        } else {
            // Menu was open — if finger released over a link, navigate it
            if (e.changedTouches) {
                const t = e.changedTouches[0];
                const el = document.elementFromPoint(t.clientX, t.clientY);
                let node = el;
                while (node && node !== container) {
                    if (node.tagName === 'A') { node.click(); break; }
                    node = node.parentElement;
                }
            }
            closeMenu();
        }
    }

    // ── Touch drag: track finger position during hold ──────────────────────────
    btn.addEventListener('touchmove', (e) => {
        if (!container.classList.contains('active')) return;
        e.preventDefault();
        const t = e.touches[0];
        updateArrow(t.clientX, t.clientY, true);
        highlightSlice(sliceFromPoint(t.clientX, t.clientY), true);
    }, { passive: false });

    // Touch events (mobile)
    btn.addEventListener('touchstart', startHold, { passive: false });
    btn.addEventListener('touchend', endHold);
    btn.addEventListener('touchcancel', closeMenu);

    // Mouse events (desktop fallback)
    btn.addEventListener('mousedown', startHold);
    window.addEventListener('mouseup', endHold);

    // Close if user taps outside while menu is open
    document.addEventListener('touchstart', (e) => {
        if (container.classList.contains('active') && !container.contains(e.target)) {
            closeMenu();
        }
    }, { passive: true });

    // ── Mouse hover on links (desktop) ─────────────────────────────────────────
    linkSliceMap.forEach(({ link, slice }) => {
        link.addEventListener('mouseenter', () => highlightSlice(slice));
        link.addEventListener('mouseleave', () => clearSlice());
    });
</script>
